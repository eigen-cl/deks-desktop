name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: deks-desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      notarize: ${{ steps.apple_mode.outputs.notarize }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify annotated tag is the reviewed main commit
        shell: bash
        run: |
          git fetch origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" --force --no-tags
          git fetch origin main:refs/remotes/origin/main --no-tags
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$(git rev-parse origin/main)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run release:validate
      - name: Verify the installable MCP dependency contract
        shell: bash
        run: |
          npm ci --prefix bundled-mcp --omit=dev --ignore-scripts
          cd bundled-mcp
          node -e "Promise.all([import('@deks-js/document'), import('@deks-js/render-preview'), import('playwright')])"
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Select the safe macOS notarization mode
        id: apple_mode
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          configured=0
          test -n "$APPLE_API_KEY_BASE64" && configured=$((configured + 1))
          test -n "$APPLE_API_KEY_ID" && configured=$((configured + 1))
          test -n "$APPLE_API_ISSUER" && configured=$((configured + 1))
          test "$configured" -eq 0 -o "$configured" -eq 3
          test "$configured" -eq 3 && echo "notarize=true" >> "$GITHUB_OUTPUT" || echo "notarize=false" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact_name: macos-universal
            build_args: --target universal-apple-darwin --bundles dmg
            artifact_path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-2022
            artifact_name: windows-x64
            build_args: --bundles nsis,msi
            artifact_path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: ubuntu-24.04
            artifact_name: linux-x64
            build_args: --bundles deb,appimage,rpm
            artifact_path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89.0
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 rpm
      - run: npm ci
      - name: Verify required scoped Apple signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK || secrets.MACOS_CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD || secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.CSC_NAME || secrets.MACOS_CSC_NAME }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            test -n "${!name}" || { echo "Missing required macOS signing credential: $name"; exit 1; }
          done
      - name: Prepare optional scoped Apple notarization credentials
        if: runner.os == 'macOS' && needs.validate.outputs.notarize == 'true'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/deks-apple-notary-key.p8"
          APPLE_API_KEY_PATH="$key_path" node -e "require('node:fs').writeFileSync(process.env.APPLE_API_KEY_PATH, Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64'), { mode: 0o600 })"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Build macOS signed and notarized DMG
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK || secrets.MACOS_CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD || secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.CSC_NAME || secrets.MACOS_CSC_NAME }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run tauri -- build ${{ matrix.build_args }}
      - name: Verify macOS signature and notarization ticket
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg_path=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg_path"
          mount_dir=$(mktemp -d)
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rmdir "$mount_dir" || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_path" -mountpoint "$mount_dir" -nobrowse -quiet
          mounted_app=$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$mounted_app"
          codesign --verify --deep --strict "$mounted_app"
          if [ "${{ needs.validate.outputs.notarize }}" = "true" ]; then
            spctl --assess --type execute --verbose "$mounted_app"
            xcrun stapler validate "$dmg_path"
          fi
      - name: Remove temporary Apple API key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP/deks-apple-notary-key.p8"
      - name: Build Windows or Linux packages
        if: runner.os != 'macOS'
        run: npm run tauri -- build ${{ matrix.build_args }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: downloaded-artifacts
      - name: Assemble immutable release assets and SHA-256 checksums
        shell: bash
        run: |
          mkdir release-files
          find downloaded-artifacts -type f -exec cp {} release-files/ \;
          test "$(find release-files -type f | wc -l)" -eq 6
          cd release-files
          sha256sum -- * > SHA256SUMS.txt
      - name: Create complete GitHub Release from the existing annotated tag
        if: needs.validate.outputs.notarize == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-files/* --verify-tag --latest --title "DEKS Desktop $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
      - name: Create draft GitHub Release pending local Apple notarization
        if: needs.validate.outputs.notarize != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-files/* --verify-tag --draft --title "DEKS Desktop $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
