name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: deks-desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      updater: ${{ steps.updater_mode.outputs.enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify annotated tag is the reviewed main commit
        shell: bash
        run: |
          git fetch origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" --force --no-tags
          git fetch origin main:refs/remotes/origin/main --no-tags
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$(git rev-parse origin/main)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run release:validate
      - name: Verify the installable MCP dependency contract
        shell: bash
        run: |
          npm ci --prefix bundled-mcp --omit=dev --ignore-scripts
          cd bundled-mcp
          node -e "Promise.all([import('@deks-js/document'), import('@deks-js/render-preview'), import('playwright')])"
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Select the update channel mode
        id: updater_mode
        shell: bash
        env:
          UPDATER_READY: ${{ vars.DESKTOP_UPDATER_READY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          # El canal se activa sólo con el par de claves completo. Publicar
          # artefactos de actualización sin firma anunciaría una versión que
          # ningún cliente puede instalar.
          enabled=false
          if [ "$UPDATER_READY" = "true" ]; then
            test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::Falta TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
            test -n "$TAURI_UPDATER_PUBKEY" || { echo "::error::Falta TAURI_UPDATER_PUBKEY"; exit 1; }
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
      - name: Verify the Apple notarization credentials
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Notarizar es obligatorio. Un DMG firmado pero sin notarizar es un
          # DMG que Gatekeeper rechaza: publicarlo sería anunciar una descarga
          # que nadie puede abrir, y arreglarlo a mano después ya costó una
          # release. Falta una credencial, falla el release, no la persona.
          for name in APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            test -n "${!name}" || { echo "::error::Falta el secret de notarización $name"; exit 1; }
          done

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact_name: macos-universal
            build_args: --target universal-apple-darwin --bundles dmg
            artifact_path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-2022
            artifact_name: windows-x64
            build_args: --bundles nsis,msi
            artifact_path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: ubuntu-24.04
            artifact_name: linux-x64
            build_args: --bundles deb,appimage,rpm
            artifact_path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89.0
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 rpm
      - run: npm ci
      - name: Prepare the signed update channel
        if: needs.validate.outputs.updater == 'true'
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          node -e "
            const fs = require('node:fs');
            const path = 'src-tauri/tauri.updater.conf.json';
            const config = JSON.parse(fs.readFileSync(path, 'utf8'));
            config.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBKEY;
            fs.writeFileSync(path, JSON.stringify(config, null, 2));
          "
          echo "DEKS_TAURI_CONFIG=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
      - name: Verify required scoped Apple signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK || secrets.MACOS_CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD || secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.CSC_NAME || secrets.MACOS_CSC_NAME }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            test -n "${!name}" || { echo "Missing required macOS signing credential: $name"; exit 1; }
          done
      - name: Prepare the scoped Apple notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/deks-apple-notary-key.p8"
          APPLE_API_KEY_PATH="$key_path" node -e "require('node:fs').writeFileSync(process.env.APPLE_API_KEY_PATH, Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64'), { mode: 0o600 })"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Build macOS signed and notarized DMG
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK || secrets.MACOS_CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD || secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.CSC_NAME || secrets.MACOS_CSC_NAME }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build ${{ matrix.build_args }} ${{ env.DEKS_TAURI_CONFIG }}
      # Tauri notariza y grapa el `.app`, no el contenedor. Un DMG sin ticket
      # propio obliga a Gatekeeper a preguntarle a Apple en el primer arranque:
      # funciona con red y falla sin ella, que es justo cuando alguien acaba de
      # bajar el instalador para una máquina nueva. Se grapa aquí, no a mano.
      - name: Notarize and staple the DMG itself
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmg_path=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg_path"
      - name: Verify macOS signature and notarization ticket
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg_path=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg_path"
          mount_dir=$(mktemp -d)
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rmdir "$mount_dir" || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_path" -mountpoint "$mount_dir" -nobrowse -quiet
          mounted_app=$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$mounted_app"
          codesign --verify --deep --strict "$mounted_app"
          codesign --verify --strict "$dmg_path"
          spctl --assess --type execute --verbose "$mounted_app"
          # Los dos tickets: el que Tauri grapa en la app y el del contenedor.
          xcrun stapler validate "$mounted_app"
          xcrun stapler validate "$dmg_path"
      - name: Remove temporary Apple API key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP/deks-apple-notary-key.p8"
      - name: Build Windows or Linux packages
        if: runner.os != 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build ${{ matrix.build_args }} ${{ env.DEKS_TAURI_CONFIG }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: downloaded-artifacts
      - name: Assemble immutable release assets and SHA-256 checksums
        shell: bash
        env:
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          PUBLISHED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          node scripts/assemble-release-assets.mjs \
            --input downloaded-artifacts \
            --output release-files \
            --tag "$GITHUB_REF_NAME" \
            --published-at "$PUBLISHED_AT" \
            --release-url "$RELEASE_URL"
          test "$(find release-files -maxdepth 1 -type f | wc -l)" -eq 8
          test -f release-files/SHA256SUMS.txt
          test -f release-files/latest.json
      - name: Assemble the signed update manifest
        if: needs.validate.outputs.updater == 'true'
        shell: bash
        env:
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          node scripts/assemble-updater-manifest.mjs \
            --input downloaded-artifacts \
            --output release-files \
            --tag "$GITHUB_REF_NAME" \
            --release-base-url "$RELEASE_BASE_URL"
          test -f release-files/updater.json
      - name: Create the complete GitHub Release from the existing annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-files/* --verify-tag --latest --title "DEKS Desktop $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
